[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-guardian"
version = "1.0.0"
description = "AI Framework & QA Auditor for Robust Data Science & Machine Learning Projects"
readme = "README.md"
authors = [
    { name = "José Daniel Portillo", email = "jsdnlportillo@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["data-science", "machine-learning", "data-leakage", "auditing", "data-quality", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance"
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "mypy"
]

[project.urls]
Homepage = "https://github.com/PortilloLab/ds_guardian"
Repository = "https://github.com/PortilloLab/ds_guardian"
Issues = "https://github.com/PortilloLab/ds_guardian/issues"
