[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds_guardian"
version = "1.0.0"
description = "DS Guardian: An AI Framework for Robust Data Science Projects"
readme = "README.md"
authors = [
    { name = "Jose Daniel Portillo", email = "jsdnlportillo@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.5.0",
    "python-docx>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/PortilloLab/ds_guardian"
Repository = "https://github.com/PortilloLab/ds_guardian"
Documentation = "https://github.com/PortilloLab/ds_guardian/tree/main/docs"

[tool.setuptools]
packages = ["ds_guardian"]
