site_name: DS Guardian
site_description: AI Framework for Robust Data Science Projects
site_author: Jose Daniel Portillo
repo_url: https://github.com/PortilloLab/ds_guardian
repo_name: PortilloLab/ds_guardian

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - code.copy

nav:
  - Inicio: index.md
  - Guía de Inicio: getting-started.md
  - Instalación: installation.md
  - Arquitectura: architecture.md
  - Referencia API: api.md
  - Tutoriales:
      - Exploración (EDA): tutorials/eda.md
      - Limpieza: tutorials/cleaning.md
      - Visualización: tutorials/visualization.md
      - Modelos: tutorials/models.md
      - Auditoría: tutorials/audit.md
  - Hoja de Ruta: roadmap.md
  - FAQ: faq.md
  - Historial de Cambios: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
